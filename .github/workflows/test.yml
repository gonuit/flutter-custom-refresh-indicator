name: Tests
on:
  pull_request:
  push:
    branches: [master]

jobs:
  checks:
    name: Analyzer and unit tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - custom_refresh_indicator
          - custom_refresh_indicator_material
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Getting packages
        run: flutter pub get
      - name: analyze
        run: flutter analyze .
      - name: tests
        run: flutter test
