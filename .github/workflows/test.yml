name: Tests
on:
  pull_request:
  push:
    branches: [master]

jobs:
  checks:
    name: Analyzer and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Getting packages
        run: flutter pub get
      - name: analyzis
        run: flutter analyze .
      - name: tests
        run: flutter test